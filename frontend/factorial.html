<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
        <title>Factorial Visualizer</title>
        <link rel="stylesheet" href="factorial-style.css" />
    </head>
    <body>
        <header class="navbar">
            <div class="nav-container">
                <h1 class="logo">Recursion Visualizer</h1>
                <nav>
                    <ul class="nav-links">
                        <li><a href="/">Home</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main class="container">
            <section class="hero">
                <h2>Factorial Recursion</h2>
                <p class="hero-text">
                    Enter a number (0-10) to view the recursive call stack
                    that evaluates the factorial. 
                </p>
            </section>
            <section class="section">
                <div class="input-card">
                    <label for="number">Enter n:</label>
                    <input type="number" id="number" min="0" max="10" />
                    <button id="runBtn">Run</button>
                    <button id="stepBtn" disabled>Step</button>
                </div>
            </section>
            <!--
            <section class="section">
                <h3>Execution steps</h3>
                <!--changing to single div for line by line code output?->
                <div id="codePanel" class="code-panel"></div>
                <!--output for renderVariables func->
                
                <div id="varPanel">Variables</div>

                <!--output div for run button->
                <div id="output"></div>

                <!--output div for step button/visualization->
                <div class="visualizer">
                    <div id="callTree"></div>
                    <div id="stackPanel">
                        <h4>Call Stack</h4>
                        <div id="stackVisual"></div>
                    </div>
                </div>
                
            </section>-->
            <section class="section">
                <h3>Execution Steps</h3>

                <!-- Current step description — always visible -->
                <div id="stepCard" class="step-card">
                    <span class="step-label">Current Step</span>
                    <p id="stepDescription">Press Run, then use Step to walk through the recursion.</p>
                </div>

                <!-- Code panel full width above the three panels -->
                <div id="codePanel" class="code-panel"></div>

                <!-- Three equal panels -->
                <div class="visualizer">
                    <div id="varPanel" class="panel">
                        <h4 class="panel-label">Variables</h4>
                        <div id="varContent">—</div>
                    </div>
                    <div id="stackPanel" class="panel">
                        <h4 class="panel-label">Call Stack</h4>
                        <div id="stackVisual"></div>
                    </div>
                    <div id="callTree" class="panel">
                        <h4 class="panel-label">Call Tree</h4>
                    </div>
                </div>
            </section>
        </main>
        <script>

            // --- Globals/Constants ---
            const runBtn = document.getElementById("runBtn");
            const stepBtn = document.getElementById("stepBtn");
            const stackVisual = document.getElementById("stackVisual");
            const callTree = document.getElementById("callTree");
            const codePanel = document.getElementById("codePanel");
            const varPanel = document.getElementById("varPanel");
            const stack = [];
            //let origCode = codePanel.innerText.trim();
            const codeLines = [
                "1: def factorial(n):",
                "2:     if n <= 1:",
                "3:         return 1",
                "4:     return n * factorial(n - 1)"
            ];
            let steps = [];
            let currentStep = 0;

            // --- Functions ---

            // --- create code panel ---
            function initCodePanel(){
                codePanel.innerHTML = "";

                for (let line of codeLines){
                    const div = document.createElement("div");
                    div.classList.add("code-line");
                    const lineNumber = line.split(":")[0];
                    div.dataset.line = lineNumber;
                    div.textContent = line;
                    codePanel.appendChild(div);
                }
            }

            // --- update frame ---
            function updateActiveFrame(){
                const frames = stackVisual.children;
                for (let frame of frames){
                    frame.classList.remove("active");
                }
                if (frames.length > 0){
                    frames[frames.length-1].classList.add("active");
                }
            }

            // --- Render functions ---
            function renderDescription(step){
                document.getElementById("stepDescription").textContent = step.description;
            }

            function renderStack(step){
                if (step.event === "call"){
                    const frame = document.createElement("div");
                    frame.classList.add("stack-frame");
                    frame.textContent = `factorial(${step.n})`;

                    stackVisual.appendChild(frame);

                    stack.push({
                        elem : frame,
                        n : step.n
                    });

                    updateActiveFrame();
                }

                if (step.event === "return"){
                    const frameObj = stack.pop();
                    
                    if (!frameObj){
                        return
                    }

                    frameObj.elem.textContent = 
                    `factorial(${step.n}) = ${step.returnVal}`;

                    frameObj.elem.classList.add("resolved");

                    updateActiveFrame();
                }
            }

            function renderCode(step){
                
                const lines = codePanel.children;

                for (let line of lines){
                    line.classList.remove("active");
                }

                const active = codePanel.querySelector(
                    `[data-line="${step.line}"]`
                );

                if (active){
                    active.classList.add("active");
                }
            }

            function renderVariables(step){
                let html = `<p>n = ${step.n}</p>`;
                if (step.returnVal !== null && step.returnVal !== undefined){
                    html += `<p>return = ${step.returnVal}</p>`;
                }
                document.getElementById("varContent").innerHTML = html;
            }

            // --- Execute Step ---
            function executeStep() {
                if (currentStep >= steps.length){
                    stepBtn.disabled = true;
                    return;
                    }
                const step = steps[currentStep];

                renderDescription(step);
                renderStack(step);
                renderCode(step);
                renderVariables(step);

                currentStep++;

            }
            // --- Listeners ---
            // step button, uses functions to display stack frames
            stepBtn.addEventListener("click", executeStep);
            
            //run button only gets the data and resets display and state 
            runBtn.addEventListener("click", async () => {
                const n = parseInt(document.getElementById("number").value);

                if (isNaN(n)) {
                    return;
                }
                try {
                    const response = await fetch("/api/factorial", {
                        method: "POST",
                        headers: {
                            "content-type":"application/json"
                        },
                        body: JSON.stringify({n:n})
                    });
                    const data = await response.json();

                    // --- state reset ---
                    steps = data.steps;
                    currentStep = 0;
                    stack.length = 0;
                    // --- clear fields ---
                    stackVisual.innerHTML = "";
                    callTree.innerHTML = "";
                    //varPanel.innerHTML = "";
                    document.getElementById("varContent").innerHTML = "-"
                    // --- init code panel ---
                    initCodePanel()

                    // --- show the step button ---
                    stepBtn.disabled = false;
                   
                } catch (error) {
                    console.error(error);
                }
            });
        </script>
    </body>
</html>
